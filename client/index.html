<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%23F6B221'/%3E%3Cstop offset='100%25' stop-color='%2305D3B2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M25 8a4.5 4.5 0 0 0-6.36-6.36L6.5 13.78V17h3.22z' fill='none' stroke='%230F172A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='20' y1='9' x2='6' y2='23' stroke='%230F172A' stroke-width='2'/%3E%3Ccircle cx='23' cy='23' r='3' fill='%230F172A'/%3E%3Cpath d='M26 23v-7l-6 2' stroke='%230F172A' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bardtale AI • Stories, Art & Ballads on Nimiq</title>
    <!-- Modern Typography: Plus Jakarta Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0B0F19; color:#F3F4F6; font-family:'Plus Jakarta Sans',sans-serif; text-align:center; padding:20px;">
        <div style="position:relative; width:72px; height:72px; margin-bottom:20px;">
          <div style="position:absolute; inset:-8px; border-radius:50%; background:radial-gradient(circle, rgba(246,178,33,0.35) 0%, rgba(5,211,178,0) 70%); animation:pulse 1.8s infinite ease-in-out;"></div>
          <svg style="width:72px; height:72px; position:relative; z-index:1;" viewBox="0 0 32 32">
            <defs>
              <linearGradient id="brandG" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#F6B221"/>
                <stop offset="100%" stop-color="#05D3B2"/>
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="8" fill="url(#brandG)"/>
            <path d="M25 8a4.5 4.5 0 0 0-6.36-6.36L6.5 13.78V17h3.22z" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="20" y1="9" x2="6" y2="23" stroke="#0F172A" stroke-width="2"/>
            <circle cx="23" cy="23" r="3" fill="#0F172A"/>
          </svg>
        </div>
        <h2 style="font-family:'Playfair Display',serif; font-size:1.65rem; font-weight:800; margin:0 0 8px 0; background:linear-gradient(135deg,#F6B221 0%,#05D3B2 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">
          Bardtale AI Studio
        </h2>
        <p style="font-size:0.85rem; color:#94A3B8; margin:0 0 24px 0; max-width:280px;">
          Summoning minstrel lore, AI storytellers & Nimiq Pay wallet...
        </p>
        <div style="width:180px; height:4px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; position:relative;">
          <div style="width:40%; height:100%; background:linear-gradient(90deg,#F6B221,#05D3B2); border-radius:999px; animation:loadingBar 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes loadingBar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(250%); }
          }
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.25); opacity: 0.85; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
